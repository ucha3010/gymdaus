<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="es">
    <head>
        <meta th:replace="~{static/headerMeta :: meta}">
        <link th:replace="~{static/headerLink :: link}">
        <script th:replace="~{static/headerScript :: script}"></script>
        <script th:replace="~{static/headerScriptJquery :: script}"></script>
        <script th:replace="~{static/headerScriptTable :: script}"></script>

        <title th:text="#{addresses}"></title>

        <script type="text/javascript">
            function viewDetail(gymId, gymAddressId){
                var relativeUrl = "gym/address/" + gymId + "/" + gymAddressId;
                var domain = getDomain(location.href);
                location.href = domain + relativeUrl;
            }
        </script>
    </head>
    <body>
        <div th:replace="~{static/barraUser :: div}"></div>
        <div th:replace="~{static/barraNav :: nav}"></div>
        <div th:replace="~{static/barraAdminRootButtons :: section}"></div>

        <div class="container">

            <input type="hidden" id="deleteAsk" th:value="#{confirm.delete}"/>

            <section class="marginTopBottom1Percentage text-center">
                <div th:if="${updateOK != null}" class="alert alert-success" role="alert"><span
                        th:text="#{update.ok}"></span></div>
            </section>

            <section>
                <div class="row mb-1 text-center">
                    <div class="col-md-2">
                        <a class="btn btn-success" href="#" th:href="@{/gym/new-address/__${gymModel.id}__}"><span
                                th:text="#{new.address}"></span></a>
                    </div>
                    <div class="col-9 col-md-8 colorGreen">
                        <h1><span th:text="${gymModel.name}"></span> - <span th:text="#{addresses}"></span></h1>
                    </div>
                    <div class="col-3 col-md-2">
                        <a class="btn btn-info" href="#" th:href="@{/gym/gym-admin/__${gymModel.id}__}"><span
                                th:text="#{back}"></span></a>
                    </div>
                </div>
            </section>

            <section sec:authorize="hasRole('ROLE_ADMIN')">
                <h5 class="d-lg-none" th:text="#{to.see.full.table}"></h5>
                <table class="table table-striped table-hover sortable">
                    <thead>
                    <tr class="text-center">
                        <th scope="col" class="d-none d-lg-table-cell">
                            <button class="btn">ID</button>
                        </th>
                        <th scope="col" class="fw-normal">
                            <button class="btn"><span th:text="#{name}"></span></button>
                        </th>
                        <th scope="col" class="fw-normal">
                            <button class="btn d-none d-lg-block"><span th:text="#{enabled}"></span></button>
                        </th>
                        <th scope="col" class="fw-normal">
                            <button class="btn"><span th:text="#{address.street}"></span></button>
                        </th>
                        <th scope="col" class="fw-normal">
                            <button class="btn"><span th:text="#{address.number}"></span></button>
                        </th>
                        <th scope="col" class="d-none d-lg-table-cell">
                            <button class="btn"><span th:text="#{address.other}"></span></button>
                        </th>
                        <th scope="col" class="d-none d-lg-table-cell">
                            <button class="btn"><span th:text="#{address.city}"></span></button>
                        </th>
                        <th scope="col" class="d-none d-lg-table-cell">
                            <button class="btn"><span th:text="#{address.zip}"></span></button>
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr class="text-center" th:each="unit : ${gymModel.gymAddressModelList}" th:attr="onclick=|viewDetail('${gymModel.id}','${unit.id}')|">
                        <td class="d-none d-lg-table-cell"><span th:text="${unit.id}"></span></td>
                        <td><span th:text="${unit.name}"></span></td>
                        <td>
                            <img th:if="${unit.enabled}" class="check-img" src="#" th:src="@{/imgs/ok.png}" alt="Enabled">
                            <img th:if="${!unit.enabled}" class="check-img" src="#" th:src="@{/imgs/ko.png}" alt="Disabled">
                        </td>
                        <td><span th:text="${unit.addressStreet}"></span></td>
                        <td><span th:text="${unit.addressNumber}"></span></td>
                        <td class="d-none d-lg-table-cell"><span th:text="${unit.addressOther}"></span></td>
                        <td class="d-none d-lg-table-cell"><span th:text="${unit.addressCity}"></span></td>
                        <td class="d-none d-lg-table-cell"><span th:text="${unit.addressZip}"></span></td>
                    </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </body>

    <footer th:replace="~{static/footer :: footer}"></footer>
</html>
