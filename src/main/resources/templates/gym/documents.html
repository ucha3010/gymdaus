<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" xmlns="http://www.w3.org/1999/html">
    <head>
        <meta th:replace="~{static/headerMeta :: meta}">
        <link th:replace="~{static/headerLink :: link}">
        <script th:replace="~{static/headerScript :: script}"></script>
        <script th:replace="~{static/headerScriptJquery :: script}"></script>

        <title th:text="#{documents}"></title>

        <script type="text/javascript">
            function confirmDelete(documentId, name){
                let deleteAsk = $('#deleteAsk').val();
                if(confirm(deleteAsk + " " + name + "?")){
                    var relativeUrl = "gym/remove-document/" + documentId;
                    var domain = getDomain(location.href);
                    location.href = domain + relativeUrl;
                    return true;
                }
                return false;
            }
        </script>
    </head>
    <body>
        <div th:replace="~{static/barraUser :: div}"></div>
        <div th:replace="~{static/barraNav :: nav}"></div>
        <div th:replace="~{static/barraAdminRootButtons :: section}"></div>

        <div class="container">

            <input type="hidden" id="deleteAsk" th:value="#{confirm.delete}"/>

            <section class="marginTopBottom1Percentage text-center">
                <div th:if="${updateOK != null}" class="alert alert-success" role="alert"><span
                        th:text="#{update.ok}"></span></div>
            </section>

            <section>
                <div class="row mb-1 text-center">
                    <div class="col-md-2">
                    </div>
                    <div class="col-9 col-md-8 colorGreen">
                        <h1><span th:text="${gymModel.name}"></span> - <span th:text="#{documents}"></span></h1>
                    </div>
                    <div class="col-3 col-md-2">
                        <a class="btn btn-info" href="#" th:href="@{/gym/gym-admin/__${gymModel.id}__}"><span
                                th:text="#{back}"></span></a>
                    </div>
                </div>
            </section>

            <section sec:authorize="hasRole('ROLE_ADMIN')">
                <form action="#"  th:action="@{/gym/upload-document}" method="post" enctype="multipart/form-data">
                    <div class="row backgroundColorLightViolet">
                        <input type="hidden" id="gymId" name="gymId" th:value="${gymModel.id}">
                        <div class="col-md-2">
                        </div>
                        <div class="col-12 col-md-6">
                            <div class="form-group">
                                <input type="file" class="form-control" id="file" name="file" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                        </div>
                    </div>
                    <div class="row mb-3 backgroundColorLightViolet">
                        <div class="col-md-2">
                        </div>
                        <div class="col-5 col-md-2 text-center">
                            <label th:text="#{more.information}"></label>
                        </div>
                        <div class="col-7 col-md-4">
                            <input type="text" class="form-control" id="section" name="section" maxlength="100"/>
                        </div>
                        <div class="col-12 col-md-4">
                            <button type="submit" class="btn btn-success"><span th:text="#{save}"></span></button>
                        </div>
                    </div>
                </form>

                <h5 class="d-lg-none" th:text="#{to.see.full.table}"></h5>
                <table class="table table-striped table-hover sortable">
                    <thead>
                    <tr class="text-center">
                        <th scope="col" class="d-none d-lg-table-cell">
                            <button class="btn">ID</button>
                        </th>
                        <th scope="col" class="fw-normal">
                            <button class="btn"><span th:text="#{filename}"></span></button>
                        </th>
                        <th scope="col" class="fw-normal">
                            <button class="btn"><span th:text="#{registration.date}"></span></button>
                        </th>
                        <th scope="col" class="d-none d-lg-table-cell">
                            <button class="btn"><span th:text="#{more.information}"></span></button>
                        </th>
                        <th scope="col" class="fw-normal">
                        </th>
                        <th scope="col" class="fw-normal">
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr class="text-center" th:each="unit : ${gymDocumentManagerModelList}">
                        <td class="d-none d-lg-table-cell"><span th:text="${unit.id}"></span></td>
                        <td><span th:text="${unit.filename}"></span></td>
                        <td><span th:text="${#calendars.format(unit.creationDate,'dd/MM/yyyy HH:mm:ss')}"></span></td>
                        <td class="d-none d-lg-table-cell"><span th:text="${unit.section}"></span></td>
                        <td>
                            <a class="btn btn-primary" href="#" th:href="@{/gym/download/__${gymModel.id}__/__${unit.id}__}">
                                <i class="bi bi-download"></i>
                            </a>
                        </td>
                        <td>
                            <a class="btn btn-danger" href="#"
                               th:attr="onclick=|confirmDelete('${unit.id}','${unit.filename}')|">
                                <span th:text="#{delete}"></span>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </body>

    <footer th:replace="~{static/footer :: footer}"></footer>
</html>
