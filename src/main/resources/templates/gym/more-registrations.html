<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="es">
    <head>
        <meta th:replace="~{static/headerMeta :: meta}">
        <link th:replace="~{static/headerLink :: link}">
        <script th:replace="~{static/headerScript :: script}"></script>
        <script th:replace="~{static/headerScriptJquery :: script}"></script>
        <script th:replace="~{static/headerScriptTable :: script}"></script>

        <title th:text="#{menu1.more.registrations}"></title>

        <script type="text/javascript">
            function validate(){

                var field = ['name'];
                restore();
                var validated = true;
                for(var i=0; i < field.length; i++){
                    var rolName = document.getElementById(field[i]);
                    var rolNameError = document.getElementById(field[i]+'Error');
                    if(rolName.value==''){
                        if(rolNameError != null){
                            rolNameError.className = "colorRed";
                        }
                        rolName.style.borderColor="red";
                        validated = false;
                    }
                }

                var moreRegistration = document.getElementById('moreRegistration').selectedOptions[0];
                document.getElementById('moreRegistrationId').value = moreRegistration.value;

                if(validated){
                    return true;
                } else {
                    document.getElementById('thereIsError').className = "colorRed";
                    return false;
                }
            }

            function restore(){
                var errorSpan = document.getElementsByName('errorSpan');
                for (var i = 0; i < errorSpan.length; i++) {
                    errorSpan[i].className = "d-none";
                }
                var fields = document.getElementsByClassName("form-control");
                for (var i = 0; i < fields.length; i++) {
                    fields[i].style.borderColor="#ced4da";
                }
            }

            function viewDetail(gymMoreRegistrationId){
                var relativeUrl = "gymMoreRegistration/more-registration/" + gymMoreRegistrationId;
                var domain = getDomain(location.href);
                location.href = domain + relativeUrl;
            }
        </script>
    </head>
    <body>
        <div th:replace="~{static/barraUser :: div}"></div>
        <div th:replace="~{static/barraNav :: nav}"></div>
        <div th:replace="~{static/barraAdminRootButtons :: section}"></div>

        <div class="container">

            <section class="marginTopBottom1Percentage text-center">
                <div th:if="${updateOK != null}" class="alert alert-success" role="alert"><span
                        th:text="#{update.ok}"></span></div>
                <div th:if="${eraseOK != null}" class="alert alert-success" role="alert"><span
                        th:text="#{erase.ok}"></span></div>
            </section>

            <section>
                <div class="row mb-1 text-center">
                    <div class="col-md-2">
                    </div>
                    <div class="col-9 col-md-8 colorGreen">
                        <h1><span th:text="${gymModel.name}"></span> - <span th:text="#{menu1.more.registrations}"></span></h1>
                    </div>
                    <div class="col-3 col-md-2">
                        <a class="btn btn-info" href="#" th:href="@{/gym/gym-admin/__${gymModel.id}__}"><span
                                th:text="#{back}"></span></a>
                    </div>
                </div>
            </section>



            <section sec:authorize="hasRole('ROLE_ADMIN')">
                <form action="#" th:action="@{/gymMoreRegistration/more-registration}"
                      th:object="${gymMoreRegistrationModel}" method="post" onsubmit="return validate()">

                    <input type="hidden" name="moreRegistrationModel.id" id="moreRegistrationId"/>
                    <input type="hidden" name="gymModel.id" th:value="${gymModel.id}"/>
                    <div class="row mb-3">
                        <div class="col-12 col-md-1">
                            <label for="name" th:text="#{name}"></label>
                        </div>
                        <div class="col-9 col-md-3">
                            <input type="text" th:field="*{name}" class="form-control" id="name" />
                        </div>
                        <div class="col-3 col-md-1">
                        </div>
                        <div class="col-md-1">
                        </div>
                        <div class="col-7 col-md-3">
                            <select id="moreRegistration" class="form-select">
                                <option th:each="unit : ${moreRegistrationModelList}" th:value="${unit.id}"
                                        th:text="#{__${unit.name}__}"></option>
                            </select>
                        </div>
                        <div class="col-3 col-md-1">
                            <button class="btn btn-success" type="submit"><span th:text="#{save}"></span></button>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="d-none col-lg-6">
                        </div>
                        <div class="col-12 col-lg-6">
                            <span id="thereIsError" name="errorSpan" class="d-none" th:text="#{fillObligatory}"></span>
                        </div>
                    </div>
                </form>
            </section>

            <section sec:authorize="hasRole('ROLE_ADMIN')">
                <h5 class="d-lg-none" th:text="#{to.see.full.table}"></h5>
                <table class="table table-striped table-hover sortable">
                    <thead>
                    <tr class="text-center">
                        <th scope="col" class="d-none d-lg-table-cell">
                            <button class="btn">ID</button>
                        </th>
                        <th scope="col" class="fw-normal">
                            <button class="btn"><span th:text="#{enabled}"></span></button>
                        </th>
                        <th scope="col" class="fw-normal">
                            <button class="btn"><span th:text="#{name}"></span></button>
                        </th>
                        <th scope="col" class="fw-normal">
                            <button class="btn"><span th:text="#{activity}"></span></button>
                        </th>
                        <th scope="col" class="d-none d-lg-table-cell">
                            <button class="btn"><span th:text="#{registration.date}"></span></button>
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr class="text-center" th:each="unit : ${gymMoreRegistrationModelList}" th:attr="onclick=|viewDetail('${unit.id}')|">
                        <td class="d-none d-lg-table-cell"><span th:text="${unit.id}"></span></td>
                        <td>
                            <img th:if="${unit.enabled}" class="check-img" src="#" th:src="@{/imgs/ok.png}" alt="Enabled">
                            <img th:if="${!unit.enabled}" class="check-img" src="#" th:src="@{/imgs/ko.png}" alt="Disabled">
                        </td>
                        <td><span th:text="${unit.name}"></span></td>
                        <td><span th:text="#{__${unit.moreRegistrationModel.name}__}"></span></td>
                        <td class="d-none d-lg-table-cell text-center"><span
                                th:text="${#calendars.format(unit.registrationDate,'dd/MM/yyyy')}"></span></td>
                    </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </body>

    <footer th:replace="~{static/footer :: footer}"></footer>
</html>
