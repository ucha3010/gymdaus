<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="es">
<head>
    <meta th:replace="~{static/headerMeta :: meta}">
    <link th:replace="~{static/headerLink :: link}">
    <script th:replace="~{static/headerScript :: script}"></script>
    <script th:replace="~{static/headerScriptJquery :: script}"></script>
    <script th:replace="~{static/headerScriptTable :: script}"></script>

    <title th:text="#{users}"></title>

    <script>
        function viewDetail(username){
            var relativeUrl = "root/user/" + username;
            var domain = getDomain(location.href);
            location.href = domain + relativeUrl;
        }
    </script>

</head>
<body>
    <div th:replace="~{static/barraUser :: div}"></div>
    <div th:replace="~{static/barraNav :: nav}"></div>

    <div class="container">
        <section class="marginTopBottom3Percentage text-center">
            <div th:if="${updateOK != null}" class="alert alert-success" role="alert"><span th:text="#{update.ok}"></span></div>
            <div th:if="${eraseOk != null}" class="alert alert-success" role="alert"><span th:text="#{erase.ok}"></span></div>
            <div th:if="${eraseError != null}" class="alert alert-danger" role="alert"><span th:text="${erase.ko}"></span></div>
        </section>

        <section>
            <div class="row align-items-center justify-content-end">
                <div class="col-3 col-md-2">
                    <a class="btn btn-info" href="#" th:href="@{/}"><span th:text="#{back}"></span></a>
                </div>
            </div>
            <div class="row mb-1 text-center">
                <div class="col-12 colorGreen">
                    <h1 th:text="#{users}"></h1>
                </div>
            </div>
        </section>
    </div>
    <section sec:authorize="hasRole('ROLE_ROOT')">
        <h5 class="d-lg-none" th:text="#{to.see.full.table}"></h5>
        <table class="table table-striped table-hover sortable">
            <thead>
            <tr class="align-middle">
                <th scope="col" class="fw-normal">
                    <button class="btn">
                        <span th:text="#{username}"></span></span>
                    </button>
                </th>
                <th scope="col" class="fw-normal">
                    <button class="btn"><span th:text="#{name}"></span><span aria-hidden="true"></span>
                    </button>
                </th>
                <th scope="col" class="fw-normal">
                    <button class="btn"><span th:text="#{lastname}"></span><span
                            aria-hidden="true"></span></button>
                </th>
                <th scope="col" class="fw-normal">
                    <button class="btn"><span th:text="#{secondLastname}"></span><span
                            aria-hidden="true"></span></button>
                </th>
                <th scope="col" class="d-none d-lg-table-cell">
                    <button class="btn"><span th:text="#{email}"></span><span aria-hidden="true"></span>
                    </button>
                </th>
                <th scope="col" class="d-none d-lg-table-cell">
                    <button class="btn"><span th:text="#{registration.date}"></span><span aria-hidden="true"></span>
                    </button>
                </th>
                <th scope="col" class="d-none d-lg-table-cell">
                    <button class="btn"><span th:text="#{enable}"></span>
                    </button>
                </th>
                <th scope="col" class="d-none d-lg-table-cell">
                    <button class="btn"><span th:text="#{role}"></span>
                    </button>
                </th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${userModelList}" th:attr="onclick=|viewDetail('${user.username}')|">
                    <td><span th:text="${user.username}"></span></td>
                    <td><span th:text="${user.name}"></span></td>
                    <td><span th:text="${user.lastname}"></span></td>
                    <td><span th:text="${user.secondLastname}"></span></td>
                    <td class="d-none d-lg-table-cell"><span th:text="${user.email}"></span></td>
                    <td class="d-none d-lg-table-cell"><span th:text="${#calendars.format(user.registrationDate,'dd/MM/yyyy')}"></span></td>
                    <td class="d-none d-lg-table-cell">
                        <img th:if="${user.enabled}" class="check-img" src="#" th:src="@{/imgs/ok.png}" alt="Enabled">
                        <img th:if="${!user.enabled}" class="check-img" src="#" th:src="@{/imgs/ko.png}" alt="Disabled">
                    </td>
                    <td class="d-none d-lg-table-cell"><span th:text="${user.userRoles[0]}"></span></td>
                </tr>
            </tbody>
        </table>
    </section>

    <div class="row align-items-center justify-content-end">
        <div class="col-3 col-md-2">
            <a class="btn btn-info" href="#" th:href="@{/}"><span
                    th:text="#{back}"></span></a>
        </div>
    </div>

</body>

<footer th:replace="~{static/footer :: footer}"></footer>
</html>
