<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
    <head>
        <meta th:replace="~{static/headerMeta :: meta}">
        <link th:replace="~{static/headerLink :: link}">
        <script th:replace="~{static/headerScript :: script}"></script>

        <title th:text="#{header.title}"></title>
    </head>
    <body>
        <div th:replace="~{static/barraUser :: div}"></div>
        <div th:replace="~{static/barraNav :: nav}"></div>
        <div th:replace="~{static/barraAdminRootButtons :: section}"></div>

        <section class="text-center">
            <div th:if="${expiredCall != null}" class="alert alert-danger" role="alert"><span
                    th:text="#{token.expired.call}"></span></div>
            <div th:if="${gymUserAssigned != null}" class="alert alert-success" role="alert"><span
                    th:text="#{invite.user.done}"></span>!</div>
        </section>

        <div class="container mt-3">
            <section>
                <div class="row justify-content-center">
                    <div class="col colorGreen">
                        <h1 th:text="#{body.title}"></h1>
                    </div>
                </div>
            </section>

            <div class="row align-items-center justify-content-center">
                <div class="col-12 col-xl-8">
                    <div id="carouselExampleInterval" class="carousel slide" data-bs-ride="carousel">
                        <div class="carousel-inner">
                            <div class="carousel-item active" data-bs-interval="3000">
                                <img src="#" th:src="@{/photos/mainPage/__${mainPhoto}__}" class="d-block w-100" alt="">
                            </div>
                            <div th:each="photo : ${photoList}" class="carousel-item" data-bs-interval="3000">
                                <img src="#" th:src="@{/photos/gym/__${photo}__}" class="d-block w-100" alt="">
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval"
                                data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden" th:text="#{Previous}"></span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval"
                                data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden" th:text="#{Next}"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </body>

    <footer th:replace="~{static/footer :: footer}"></footer>

</html>
