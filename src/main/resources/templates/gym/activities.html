<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="es">
    <head>
        <meta th:replace="~{static/headerMeta :: meta}">
        <link th:replace="~{static/headerLink :: link}">
        <script th:replace="~{static/headerScript :: script}"></script>
        <script th:replace="~{static/headerScriptJquery :: script}"></script>

        <title th:text="#{menu1.activities}"></title>

        <script type="text/javascript">
            function addActivity(){
                var gymAddressId = document.getElementById('gymAddressId').selectedOptions[0];
                var activityId = document.getElementById('gymActivityId').selectedOptions[0];
                var relativeUrl = "gymActivity/new-activity/" + gymAddressId.value + "/" + activityId.value;
                var domain = getDomain(location.href);
                location.href = domain + relativeUrl;
            }
            function viewDetail(gymActivityId){
                var relativeUrl = "gymActivity/activity/" + gymActivityId;
                var domain = getDomain(location.href);
                location.href = domain + relativeUrl;
            }
        </script>
    </head>
    <body>
        <div th:replace="~{static/barraUser :: div}"></div>
        <div th:replace="~{static/barraNav :: nav}"></div>
        <div th:replace="~{static/barraAdminRootButtons :: section}"></div>

        <div class="container">

            <section class="marginTopBottom1Percentage text-center">
                <div th:if="${updateOK != null}" class="alert alert-success" role="alert"><span
                        th:text="#{update.ok}"></span></div>
            </section>

            <section>
                <div class="row mb-1 text-center">
                    <div class="col-md-2">
                    </div>
                    <div class="col-9 col-md-8 colorGreen">
                        <h1><span th:text="${gymModel.name}"></span> - <span th:text="#{menu1.activities}"></span></h1>
                    </div>
                    <div class="col-3 col-md-2">
                        <a class="btn btn-info" href="#" th:href="@{/gym/gym-admin/__${gymModel.id}__}"><span
                                th:text="#{back}"></span></a>
                    </div>
                </div>
            </section>



            <section sec:authorize="hasRole('ROLE_ADMIN')">
                <div class="row mb-3">
                    <div class="col-12 col-md-1">
                        <label for="gymAddressId" th:text="#{address}"></label>
                    </div>
                    <div class="col-9 col-md-3">
                        <select id="gymAddressId" class="form-select">
                            <option th:each="unit : ${gymModel.gymAddressModelList}" th:value="${unit.id}"
                                    th:text="${unit.name}"></option>
                        </select>
                    </div>
                    <div class="col-3 col-md-1">
                    </div>
                    <div class="col-12 col-md-1">
                        <label for="gymActivityId" th:text="#{activity}"></label>
                    </div>
                    <div class="col-7 col-md-3">
                        <select id="gymActivityId" class="form-select">
                            <option th:each="unit : ${activityModelList}" th:value="${unit.id}"
                                    th:text="#{__${unit.name}__}"></option>
                        </select>
                    </div>
                    <div class="col-3 col-md-1">
                        <a class="btn btn-success" onclick="addActivity()"><span th:text="#{save}"></span></a>
                    </div>
                </div>
            </section>

            <section sec:authorize="hasRole('ROLE_ADMIN')">
                <h5 class="d-lg-none" th:text="#{to.see.full.table}"></h5>
                <table class="table table-striped table-hover sortable">
                    <thead>
                    <tr class="text-center">
                        <th scope="col" class="d-none d-lg-table-cell">
                            <button class="btn">ID</button>
                        </th>
                        <th scope="col" class="fw-normal">
                            <button class="btn"><span th:text="#{address}"></span></button>
                        </th>
                        <th scope="col" class="fw-normal">
                            <button class="btn"><span th:text="#{activity}"></span></button>
                        </th>
                        <th scope="col" class="d-none d-lg-table-cell">
                            <button class="btn"><span th:text="#{registration.date}"></span></button>
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr class="text-center" th:each="unit : ${gymActivityModelList}" th:attr="onclick=|viewDetail('${unit.id}')|">
                        <td class="d-none d-lg-table-cell"><span th:text="${unit.id}"></span></td>
                        <td><span th:text="${unit.gymAddressModel.name}"></span></td>
                        <td><span th:text="#{__${unit.activityModel.name}__}"></span></td>
                        <td class="d-none d-lg-table-cell text-center"><span
                                th:text="${#calendars.format(unit.registrationDate,'dd/MM/yyyy')}"></span></td>
                    </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </body>

    <footer th:replace="~{static/footer :: footer}"></footer>
</html>
