<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover en Lista</title>
    <style>
        ul {
            //list-style-type: none;
            //padding: 0;
        }

        li {
            position: relative; /* Necesario para posicionar el mensaje */
            padding: 10px;
            margin: 5px 0;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            //cursor: pointer;
        }

        /* Estilo del mensaje emergente */
        .tooltip {
            display: none;
            position: absolute;
            top: 60%; /* Debajo del li */
            left: 0%;
            //transform: translateX(-50%);
            //background-color: #fff;
            //color: #000;
            //padding: 5px;
            //border-radius: 5px;
            font-size: 12px;
            //white-space: nowrap;
            z-index: 10;
        }

        /* Mostrar el mensaje cuando se hace hover */
        li:hover .tooltip {
            display: block;
        }
    </style>
  </head>
  <body>
    <ul>
      <li>
        Dato 1
        <span class="tooltip">Mensaje adicional para Dato 1</span>
      </li>
      <li>
        Dato 2
        <span class="tooltip">Mensaje adicional para Dato 2 en el cual quiero ver que pasa si el mensaje es realmente demasiado largo y tengo que ver si hace bucle o qué es lo que hace realmente</span>
      </li>
      <li>
        Dato 3
        <span class="tooltip">Mensaje adicional para Dato 3</span>
      </li>
    </ul>
  </body>
</html>
