<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Tabla Ordenable</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <div class="container mt-5">
      <h2>Formulario con Tabla</h2>
      <form>
        <div class="mb-3">
          <label for="inputExample" class="form-label">Campo de ejemplo:</label>
          <input type="text" class="form-control" id="inputExample" placeholder="Ingrese algo">
        </div>
        <table class="table table-bordered table-striped">
          <thead>
          <tr>
            <th scope="col" class="sortable" onclick="sortTable(0)">Columna 1 ▲</th>
            <th scope="col" class="sortable" onclick="sortTable(1)">Columna 2 ▲</th>
            <th scope="col" class="sortable" onclick="sortTable(2)">Columna 3 ▲</th>
            <th scope="col">Columna 4</th>
            <th scope="col">Columna 5</th>
          </tr>
          </thead>
          <tbody>
          <tr>
            <td>Manzana</td>
            <td>Beta</td>
            <td>Rojo</td>
            <td>30</td>
            <td>Extra</td>
          </tr>
          <tr>
            <td>Banana</td>
            <td>Alfa</td>
            <td>Amarillo</td>
            <td>20</td>
            <td>Extra</td>
          </tr>
          <tr>
            <td>Cereza</td>
            <td>Delta</td>
            <td>Verde</td>
            <td>50</td>
            <td>Extra</td>
          </tr>
          </tbody>
        </table>
      </form>
    </div>

    <script>
    function sortTable(columnIndex) {
        const table = document.querySelector("table tbody");
        const rows = Array.from(table.rows);
        const isDescending = table.getAttribute("data-sort") === "desc"; // Verificar si está en estado descendente
        const direction = isDescending ? 1 : -1;

        rows.sort((a, b) => {
            const textA = a.cells[columnIndex].textContent.trim().toLowerCase();
            const textB = b.cells[columnIndex].textContent.trim().toLowerCase();

            return textA > textB ? direction : textA < textB ? -direction : 0;
        });

        table.innerHTML = "";
        rows.forEach(row => table.appendChild(row));
        table.setAttribute("data-sort", isDescending ? "asc" : "desc"); // Cambiar estado de orden
    }
</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
