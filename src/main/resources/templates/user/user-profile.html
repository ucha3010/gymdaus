<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
    <head>
        <meta th:replace="~{static/headerMeta :: meta}">
        <link th:replace="~{static/headerLink :: link}">
        <script th:replace="~{static/headerScript :: script}"></script>

        <title th:text="#{profile}"></title>

        <script type="text/javascript">
		function validate(){

			var field = ['name','lastname','birthdate','email'];
			restore();
			var validated = true;
			for(var i=0; i < field.length; i++){
			    var rolName = document.getElementById(field[i]);
			    var rolNameError = document.getElementById(field[i]+'Error');
				if(rolName.value==''){
					if(rolNameError != null){
						rolNameError.className = "colorRed";
					}
					rolName.style.borderColor="red";
					validated = false;
				}
			}
			
			if(validated){
				return true;
			} else {
				document.getElementById('thereIsError').className = "colorRed";
				return false;
			}
		}
		function restore(){
			var errorSpan = document.getElementsByName('errorSpan');
			for (var i = 0; i < errorSpan.length; i++) {
				errorSpan[i].className = "d-none";
			}
			var fields = document.getElementsByClassName("form-control");
			for (var i = 0; i < fields.length; i++) {
				fields[i].style.borderColor="#ced4da";
			}
		}


        </script>
    </head>
    <body>
        <div th:replace="~{static/barraUser :: div}"></div>
        <div th:replace="~{static/barraNav :: nav}"></div>

        <div class="container">

            <section class="marginBottom2Percentage text-center">
                <div th:if="${updateUserError != null}" class="alert alert-danger" role="alert"><span
                        th:text="#{update.user.error}"></span></div>
                <div th:if="${updateUserOk != null}" class="alert alert-success" role="alert"><span
                        th:text="#{update.user.ok}"></span></div>
            </section>

            <form sec:authorize="isAuthenticated()" action="#" th:action="@{/user/update}" th:object="${user}"
                  method="post" onsubmit="return validate()">

                <input type="hidden" name="enabled" th:value="${user.enabled}"/>
                <input type="hidden" name="username" th:value="${user.username}"/>
                <input th:if="${user.registrationDate != null}" type="hidden" name="registrationDate"
                       th:value="${#dates.format(user.registrationDate, 'yyyy/MM/dd HH:mm:ss')}"/>


                <div class="row align-items-center justify-content-end">
                    <div class="col-3 col-md-2">
                        <img th:if="${profilePhoto == null}" src="#" th:src="@{/imgs/Logo.png}" alt="" width="100">
                        <img th:if="${profilePhoto != null}" src="#" th:src="@{__${profilePhoto}__}" alt="" width="100">
                        <a class="navbar-brand" href="#" th:href="@{/user/photo}">
                            <i class="icofont-duotone icofont-pencil" aria-hidden="true"></i>
                        </a>
                    </div>
                </div>

                <div class="row mt-2 mb-1">
                    <div class="col-3 col-md-2">
                        <label for="username" th:text="#{username}"></label>
                    </div>
                    <div class="col-9 col-md-3">
                        <input type="text" th:field="*{username}" id="username" class="form-control" disabled/>
                    </div>

                    <div class="col-md-7">
                    </div>
                </div>

                <div class="row mb-1">
                    <div class="col-3 col-md-2">
                        <label for="name" th:text="#{name}"></label>
                    </div>
                    <div class="col-9 col-md-8">
                        <input type="text" th:field="*{name}" id="name" class="form-control" size="100"/>
                    </div>
                    <div class="col-md-2">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-12">
                        <span id="nameError" name="errorSpan" class="d-none" th:text="#{obligatory}"></span>
                    </div>
                </div>

                <div class="row mb-1">
                    <div class="col-3 col-md-2">
                        <label for="lastname" th:text="#{lastname}"></label>
                    </div>
                    <div class="col-9 col-md-8">
                        <input type="text" th:field="*{lastname}" id="lastname" class="form-control" size="100"/>
                    </div>
                    <div class="col-md-2">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-12">
                        <span id="lastnameError" name="errorSpan" class="d-none" th:text="#{obligatory}"></span>
                    </div>
                </div>

                <div class="row mb-1">
                    <div class="col-3 col-md-2">
                        <label for="secondLastname" th:text="#{secondLastname}"></label>
                    </div>
                    <div class="col-9 col-md-8">
                        <input type="text" th:field="*{secondLastname}" id="secondLastname" class="form-control"
                               size="100"/>
                    </div>
                    <div class="col-md-2">
                    </div>
                </div>

                <div class="row mb-1">
                    <div class="col-3 col-md-2">
                        <label for="phone" th:text="#{phone}"></label>
                    </div>
                    <div class="col-7 col-md-3">
                        <input type="text" th:field="*{phone}" id="phone" class="form-control" size="20"/>
                    </div>
                    <div class="col-2 col-md-7">
                    </div>
                </div>

                <div class="row mb-1">
                    <div class="col-3 col-md-2">
                        <label for="sex" th:text="#{sex}"></label>
                    </div>
                    <div class="col-9 col-md-3">
                        <select th:field="*{sex}" id="sex" class="form-select">
                            <option th:each="s : ${sexList}" th:value="${s}" th:text="#{__${s}__}"></option>
                        </select>
                    </div>
                    <div class="col-md-7">
                    </div>
                </div>

                <div class="row mb-1">
                    <div class="col-3 col-md-2">
                        <label for="birthdate" th:text="#{birthdate}"></label>
                    </div>
                    <div class="col-9 col-md-3">
                        <input type="date" th:field="*{birthdate}" id="birthdate" class="form-control"/>
                    </div>
                    <div class="col-md-7">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-12">
                        <span id="birthdateError" name="errorSpan" class="d-none" th:text="#{obligatory}"></span>
                    </div>
                </div>

                <div class="row mb-1">
                    <div class="col-3 col-md-2">
                        <label for="email" th:text="#{email}"></label>
                    </div>
                    <div class="col-9 col-md-3">
                        <input type="text" th:field="*{email}" id="email" class="form-control" size="200"/>
                    </div>
                    <div class="col-md-7">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-12">
                        <span id="emailError" name="errorSpan" class="d-none" th:text="#{obligatory}"></span>
                    </div>
                </div>

                <div class="row mb-1">
                    <div class="col-12 col-md-2">
                        <strong th:text="#{address}"></strong>
                    </div>
                    <div class="col-3 col-md-2">
                        <label for="addressStreet" th:text="#{address.street}"></label>
                    </div>
                    <div class="col-9 col-md-8">
                        <input type="text" th:field="*{addressStreet}" id="addressStreet" class="form-control"
                               size="100"/>
                    </div>
                </div>

                <div class="row mb-1">
                    <div class="col-md-2">
                    </div>
                    <div class="col-3 col-md-2">
                        <label for="addressNumber" th:text="#{address.number}"></label>
                    </div>
                    <div class="col-9 col-md-8">
                        <input type="text" th:field="*{addressNumber}" id="addressNumber" class="form-control"
                               size="30"/>
                    </div>
                </div>

                <div class="row mb-1">
                    <div class="col-md-2">
                    </div>
                    <div class="col-3 col-md-2">
                        <label for="addressOther" th:text="#{address.other}"></label>
                    </div>
                    <div class="col-9 col-md-8">
                        <input type="text" th:field="*{addressOther}" id="addressOther" class="form-control" size="50"/>
                    </div>
                </div>

                <div class="row mb-1">
                    <div class="col-md-2">
                    </div>
                    <div class="col-3 col-md-2">
                        <label for="addressCity" th:text="#{address.city}"></label>
                    </div>
                    <div class="col-9 col-md-8">
                        <input type="text" th:field="*{addressCity}" id="addressCity" class="form-control" size="50"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-2">
                    </div>
                    <div class="col-3 col-md-2">
                        <label for="addressZip" th:text="#{address.zip}"></label>
                    </div>
                    <div class="col-9 col-md-8">
                        <input type="text" th:field="*{addressZip}" id="addressZip" class="form-control" size="10"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-2">
                    </div>
                    <div class="col-3 col-md-2">
                        <label for="country" th:text="#{country}"></label>
                    </div>
                    <div class="col-9 col-md-3">
                        <select th:field="*{countryModel.id}" id="country" class="form-select">
                            <option th:each="p : ${countryList}" th:value="${p.id}" th:text="#{__${p.name}__}"></option>
                        </select>
                    </div>
                    <div class="col-md-5">
                    </div>
                </div>

                <div class="row">
                    <div class="col-1 p-0">
                    </div>
                    <div class="col-2 p-0">
                        <a class="btn btn-info" href="#" th:href="@{/}"><span th:text="#{back}"></span></a>
                    </div>
                    <div class="col-1 p-0">
                    </div>
                    <div class="col-4 p-0">
                        <a class="btn btn-warning" href="#" th:href="@{/user/change-pass}"><span
                                th:text="#{change.pass}"></span></a>
                    </div>
                    <div class="col-1 p-0">
                    </div>
                    <div class="col-2 p-0">
                        <button class="btn btn-success" type="submit"><span th:text="#{save}"></span></button>
                    </div>
                    <div class="col-1 p-0">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-6">
                    </div>
                    <div class="col-6">
                        <span id="thereIsError" name="errorSpan" class="d-none" th:text="#{fillObligatory}"></span>
                    </div>
                </div>

            </form>
        </div>
    </body>

    <footer th:replace="~{static/footer :: footer}"></footer>
</html>
